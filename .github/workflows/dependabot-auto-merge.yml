name: Dependabot Auto-merge

on:
  pull_request:
    types:
      - labeled
      - synchronize
      - opened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
      - requested
  workflow_run:
    types:
      - completed

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.event.label.name == 'automerge'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for checks to pass
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            
            // Wait for all status checks to complete
            let attempts = 0;
            const maxAttempts = 60;
            
            while (attempts < maxAttempts) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
              
              if (pr.mergeable_state === 'clean' || pr.mergeable_state === 'unstable' || pr.mergeable_state === 'has_hooks') {
                console.log(`PR is mergeable with state: ${pr.mergeable_state}`);
                break;
              }
              
              if (pr.mergeable_state === 'blocked') {
                console.log('PR is blocked, waiting...');
                await new Promise(r => setTimeout(r, 10000));
                attempts++;
              } else if (pr.mergeable_state === 'dirty') {
                console.log('PR has merge conflicts, cannot merge');
                process.exit(1);
              } else {
                console.log(`PR state: ${pr.mergeable_state}, waiting...`);
                await new Promise(r => setTimeout(r, 10000));
                attempts++;
              }
            }
            
            if (attempts >= maxAttempts) {
              console.log('Timed out waiting for checks');
              process.exit(1);
            }
          env:
            PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Auto-merge Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            
            // Check if PR is from Dependabot
            if (pr.user.login !== 'dependabot[bot]') {
              console.log('Not a Dependabot PR, skipping');
              return;
            }
            
            // Get the latest commit SHA
            const commit_sha = pr.head.sha;
            
            // Check if all required checks have passed
            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: commit_sha
            });
            
            const pendingChecks = checks.check_runs.filter(
              check => check.conclusion === null || check.conclusion === 'pending'
            );
            
            if (pendingChecks.length > 0) {
              console.log('Some checks are still pending, waiting...');
              for (const check of pendingChecks) {
                console.log(`  - ${check.name}: ${check.conclusion || 'pending'}`);
              }
              process.exit(1);
            }
            
            const failedChecks = checks.check_runs.filter(
              check => check.conclusion === 'failure' || check.conclusion === 'cancelled'
            );
            
            if (failedChecks.length > 0) {
              console.log('Some checks have failed:');
              for (const check of failedChecks) {
                console.log(`  - ${check.name}: ${check.conclusion}`);
              }
              process.exit(1);
            }
            
            // Merge the PR
            console.log('All checks passed, merging PR...');
            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number,
              merge_method: 'squash'
            });
            console.log('PR merged successfully!');
          env:
            PR_NUMBER: ${{ github.event.pull_request.number }}